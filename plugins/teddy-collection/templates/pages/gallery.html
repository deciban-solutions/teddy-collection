<style>
.group { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 22px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
.gcard, .wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.zoomable { display: block; padding: 0; margin: 0; border: 0; background: var(--tint); cursor: zoom-in; width: 100%; }
.zoomable img { display: block; width: 100%; height: auto; }
.zoomable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nophoto { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: var(--tint); color: var(--muted); font-size: 0.88rem; }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.place { font-family: var(--mono); font-weight: 500; font-size: 0.86rem; color: var(--muted); letter-spacing: 0.04em; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 0.88rem; }
dt { color: var(--muted); }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.credit { font-size: 0.8rem; color: var(--muted); }
.basis { font-size: 0.85rem; color: var(--muted); }
</style>
<div class="wrap">
<header class="page-head">
  <div class="eyebrow">{{SET}}</div>
  <h1>Gallery</h1>
  <p class="lede">Every watch the video shows, grouped as the video groups them, each with its photo, reference, how sure the identification is, a checked source link and the moment it appears. Click a photo to see it full size.</p>
</header>
