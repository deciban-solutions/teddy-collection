<style>
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 680px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card .k { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.card h3 { font-size: 1.15rem; }
.card p { font-size: 0.93rem; color: var(--muted); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.facts div { border-top: 2px solid var(--line); padding-top: 10px; min-width: 0; }
.facts b { display: block; font-family: var(--display); font-weight: 600; margin-bottom: 2px; }
.facts span { color: var(--muted); font-size: 0.92rem; }
.vlist { display: flex; flex-direction: column; gap: 6px; }
.vlist .vt { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; border-radius: 6px; overflow: hidden; }
.strip img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.findings { display: flex; flex-direction: column; gap: 10px; }
.finding { border-left: 3px solid var(--accent); padding-left: 14px; max-width: 74ch; }
</style>
<div class="wrap">
<header class="page-head">
  <div class="eyebrow">{{SET}}</div>
  <h1>Watch videos, analysed</h1>
  <p class="lede">Every video analysed so far, the watches they show, and the taxonomies behind the analyses. Each video's analysis is its own page set, linked from the Video analyses page.</p>
</header>
