<style>
.person { border-top: 1px solid var(--line); padding-top: 22px; display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.head .meta { color: var(--muted); font-size: 0.9rem; }
.grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
.photo { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0; }
.photo img { display: block; width: 100%; height: auto; }
.photo figcaption { font-size: 0.8rem; color: var(--muted); padding: 6px 10px; }
.id { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 0.9rem; }
dt { color: var(--muted); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.quotes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 680px) { .quotes { grid-template-columns: 1fr; } }
.q { background: var(--tint); border-radius: 4px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.q h3 { font-size: 0.92rem; }
.q ul { margin: 0; padding-left: 18px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 5px; }
.q .t { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 78ch; }
</style>
<div class="wrap">
<header class="page-head">
  <div class="eyebrow">{{SET}}</div>
  <h1>Wearer profiles</h1>
  <p class="lede">What each person wore, what they said about it, and the reasons they gave for their picks.</p>
<!--COMMERCIAL-->
</header>
<!--CONTENT-->
<!--FOOTER-->
</div>
