<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: a fixed side panel listing the views beside one reading column; below 900px the panel becomes a sticky top bar of scrolling chips. Views switch on the URL hash so each can be linked directly. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #16202a; --muted: #5b6875; --line: #d9dfe5;
  --accent: #1f4e8c; --tint: #e9eef4; --quote-bg: #e9eef4; --gold: #9a6b1f;
  --l1: #6b4f9a; --l2: #1f4e8c; --l3: #2f7a5a;
  --yes: #2f7a5a; --part: #9a6b1f; --no: #a3413a; --good: #2f7a5a; --warn: #9a6b1f; --bad: #a3413a;
  --side-bg: #e7ebf0; --side-active: #ffffff;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f151b; --surface:#17212a; --fg:#e5ebf0; --muted:#9aa8b5; --line:#2a3742; --accent:#7fa8e0; --tint:#1c2833; --quote-bg:#1c2833; --gold:#d8ad62;
    --l1:#b39ae0; --l2:#7fa8e0; --l3:#6fc29c; --yes:#6fc29c; --part:#d8ad62; --no:#e48a80; --good:#6fc29c; --warn:#d8ad62; --bad:#e48a80;
    --side-bg:#131b22; --side-active:#1f2b36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0f151b; --surface:#17212a; --fg:#e5ebf0; --muted:#9aa8b5; --line:#2a3742; --accent:#7fa8e0; --tint:#1c2833; --quote-bg:#1c2833; --gold:#d8ad62;
  --l1:#b39ae0; --l2:#7fa8e0; --l3:#6fc29c; --yes:#6fc29c; --part:#d8ad62; --no:#e48a80; --good:#6fc29c; --warn:#d8ad62; --bad:#e48a80;
  --side-bg:#131b22; --side-active:#1f2b36; color-scheme: dark;
}
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--side-bg); border-right: 1px solid var(--line);
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; padding-block: 26px 22px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--fg); }
.brand .k { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.brand .n { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.15; }
.back { font-size: 0.85rem; color: var(--accent); text-decoration: none; }
.back:hover { text-decoration: underline; }
.side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.side li a { display: flex; flex-direction: column; gap: 1px; padding: 9px 11px; border-radius: 5px; text-decoration: none; color: var(--fg); border-left: 3px solid transparent; }
.side li a:hover { background: var(--side-active); }
.side li a[aria-current="page"] { background: var(--side-active); border-left-color: var(--accent); }
.side .nt { font-family: var(--display); font-weight: 600; font-size: 1rem; }
.side .ns { font-size: 0.8rem; color: var(--muted); line-height: 1.35; }
.side a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.side .foot { margin-top: auto; font-size: 0.78rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.side .foot a { color: var(--accent); }
.main { min-width: 0; }
@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side-bg); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; height: auto; flex-direction: row; align-items: center; gap: 12px; border-right: none; border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; overflow: visible; }
  .brand .k, .side .ns, .side .foot { display: none; }
  .brand { min-width: 0; flex: 0 1 auto; max-width: 38vw; }
  .brand .n { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { white-space: nowrap; font-size: 0; flex: none; }
  .back::before { content: "\2190  Collection"; font-size: 0.8rem; }
  .side nav { min-width: 0; flex: 1 1 auto; overflow-x: auto; }
  .side ul { flex-direction: row; gap: 4px; }
  .side li a { padding: 6px 10px; border-left: none; border-bottom: 2px solid transparent; border-radius: 4px; white-space: nowrap; }
  .side li a[aria-current="page"] { border-bottom-color: var(--accent); }
  .side .nt { font-size: 0.9rem; }
}
/* Shared page base: every view uses one reading column with a 16px minimum gutter. */
.view .wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; display: flex; flex-direction: column; gap: 32px; }
.view h1, .view h2, .view h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.view h1 { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.view h2 { font-size: 1.45rem; font-weight: 600; }
.view h3 { font-size: 1.1rem; font-weight: 600; }
.view p { margin: 0; max-width: 70ch; }
.view a { color: var(--accent); text-underline-offset: 2px; }
.view a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view section { display: flex; flex-direction: column; gap: 14px; }
.view .page-head { display: flex; flex-direction: column; gap: 12px; }
.view .eyebrow { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.view .lede { color: var(--muted); }
.view .note { font-size: 0.86rem; color: var(--muted); }
.view blockquote { margin: 0; background: var(--quote-bg); padding: 10px 14px; border-radius: 4px; max-width: 78ch; font-size: 0.95rem; }
.view blockquote cite { display: block; font-style: normal; font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
.view .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.view table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.view th, .view td { text-align: left; vertical-align: top; padding: 8px 11px; border-bottom: 1px solid var(--line); }
.view tr:last-child td { border-bottom: none; }
.view th { font-family: var(--display); font-weight: 600; background: var(--tint); }
.view td.num, .view th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 0.85rem; }
.view .ref { font-family: var(--mono); font-size: 0.86rem; color: var(--accent); overflow-wrap: anywhere; }
.view .conf { display: inline-block; width: fit-content; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.view .conf.firm { border-color: var(--accent); color: var(--accent); }
.view .badge { display: inline-block; width: fit-content; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--warn); color: var(--warn); }
.view .badge.compiled { border-color: var(--good); color: var(--good); }
.view .commercial { background: var(--tint); border-left: 3px solid var(--gold); padding: 10px 14px; border-radius: 4px; max-width: 78ch; font-size: 0.92rem; }
.view .not-produced { border: 1px dashed var(--warn); color: var(--muted); padding: 14px 16px; border-radius: 4px; max-width: 78ch; }
.view .not-produced b { color: var(--warn); font-family: var(--display); }
.view ol.refs { margin: 0; padding-left: 22px; font-size: 0.88rem; display: flex; flex-direction: column; gap: 4px; }
.view ol.refs li { scroll-margin-top: 24px; border-radius: 3px; }
.view ol.refs li:target { background: var(--tint); outline: 2px solid var(--accent); outline-offset: 3px; }
.view a.cite { text-decoration: none; font-family: var(--mono); }
.view .page-foot { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 0.86rem; color: var(--muted); }
.view img { max-width: 100%; height: auto; }
/* Utility classes model-written fragments may use (fragments carry no CSS of their own);
   kept in step with sanitize.FRAGMENT_CLASSES. */
.view .callout { background: var(--tint); border-radius: 4px; padding: 12px 16px; max-width: 80ch; }
.view .answer { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 4px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.view .answer ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.view .wide table { min-width: 760px; }
.view .mono { font-family: var(--mono); font-size: 0.84rem; }
.view .y { color: var(--good); font-weight: 600; }
.view .p { color: var(--warn); font-weight: 600; }
.view .n { color: var(--bad); font-weight: 600; }
.view .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 680px) { .view .cards { grid-template-columns: 1fr; } }
.view .card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.view .ranks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .view .ranks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .view .ranks { grid-template-columns: 1fr; } }
.view .rank { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; }
.view .sub { font-size: 0.8rem; color: var(--muted); }
.view ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 78ch; }
.view .findings { display: flex; flex-direction: column; gap: 10px; }
.view .finding { border-left: 3px solid var(--accent); padding-left: 14px; max-width: 74ch; }
.view .legend { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
/* Full-size photo view, opened from any gallery or index photo. */
dialog.zoom { border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--surface); color: var(--fg); max-width: min(96vw, 1000px); max-height: 94vh; }
dialog.zoom::backdrop { background: rgba(10, 15, 20, 0.72); }
dialog.zoom img { display: block; max-width: 100%; max-height: 80vh; width: auto; height: auto; margin: 0 auto; }
dialog.zoom .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; font-size: 0.88rem; }
dialog.zoom button { font: inherit; background: var(--tint); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
/*PAGE_STYLES*/
</style>

<div class="shell">
  <aside class="side">
    <!--BRAND-->
    <!--BACKLINK-->
    <nav aria-label="Pages">
      <ul>
        <!--NAV-->
      </ul>
    </nav>
    <div class="foot"><!--SIDEFOOT--></div>
  </aside>
  <main class="main" data-home="{{HOME}}">
    <!--VIEWS-->
  </main>
</div>

<dialog class="zoom" id="zoom" aria-label="Full-size photo">
  <img src="" alt="">
  <div class="bar"><span class="cap"></span><button type="button" data-close>Close</button></div>
</dialog>

<script>
(function () {
  var site = {{TITLE_JS}};
  var home = document.querySelector('.main').getAttribute('data-home');
  var views = Array.prototype.slice.call(document.querySelectorAll('.main > .view'));
  var links = Array.prototype.slice.call(document.querySelectorAll('.side a[data-view]'));
  function show(id, anchor) {
    views.forEach(function (v) { v.hidden = v.id !== 'v-' + id; });
    links.forEach(function (a) {
      if (a.classList.contains('brand')) return;
      if (a.getAttribute('data-view') === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    var v = document.getElementById('v-' + id);
    document.title = (v && id !== home ? v.getAttribute('data-title') + ' · ' : '') + site;
    if (anchor) { anchor.scrollIntoView(); } else { window.scrollTo(0, 0); }
  }
  function route() {
    var h;
    try { h = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { h = ''; }
    if (h && document.getElementById('v-' + h)) { show(h, null); return; }
    var el = h ? document.getElementById(h) : null;
    var host = el ? el.closest('.main > .view') : null;
    if (host) { show(host.id.slice(2), el); return; }
    show(home, null);
  }
  window.addEventListener('hashchange', route);
  route();

  var zoom = document.getElementById('zoom');
  var zimg = zoom.querySelector('img'), zcap = zoom.querySelector('.cap');
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-zoom]') : null;
    if (b) {
      zimg.src = b.getAttribute('data-zoom');
      zimg.alt = b.getAttribute('data-alt') || '';
      zcap.textContent = b.getAttribute('data-alt') || '';
      if (zoom.showModal) zoom.showModal(); else zoom.setAttribute('open', '');
      return;
    }
    if (e.target === zoom || (e.target.closest && e.target.closest('[data-close]'))) zoom.close();
  });
})();
</script>
